name: PR44 apply final review fixes

on:
  push:
    branches:
      - agent/al-0002-05-first-slice-implementation-plan
    paths:
      - .github/workflows/pr44-final-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply owner-approved review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product/wip/mvp-0.1-first-slice-implementation-plan.md')
