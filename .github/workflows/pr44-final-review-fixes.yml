name: PR44 apply final review fixes

on:
  push:
    branches:
      - agent/al-0002-05-first-slice-implementation-plan
    paths:
      - .github/workflows/pr44-final-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Execute approved correction script from parent revision
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/pr44-final-review-fixes.yml > /tmp/pr44-parent-workflow.yml
          python3 - <<'PY2'
          from pathlib import Path

          source = Path('/tmp/pr44-parent-workflow.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, 'pr44-final-review-fixes.py', 'exec'))
          PY2

          rm .github/workflows/pr44-final-review-fixes.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Address final implementation plan review findings'
          git push
