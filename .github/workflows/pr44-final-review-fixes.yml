name: PR44 materialize final implementation plan

on:
  push:
    branches:
      - agent/al-0002-05-first-slice-implementation-plan
    paths:
      - .github/workflows/pr44-final-review-fixes.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize approved plan and remove transport files
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .tmp/pr44-final.part1 \
            .tmp/pr44-final.part2 \
            .tmp/pr44-final.part3 \
            .tmp/pr44-final.part4 \
            | base64 --decode \
            | xz --decompress \
            > docs/product/wip/mvp-0.1-first-slice-implementation-plan.md

          echo '6eaf41da059cd99d843cae2742afd85d3902cb3e389b2562e56935065b09a769  docs/product/wip/mvp-0.1-first-slice-implementation-plan.md' \
            | sha256sum --check

          rm \
            .tmp/pr44-final.part1 \
            .tmp/pr44-final.part2 \
            .tmp/pr44-final.part3 \
            .tmp/pr44-final.part4
          rmdir .tmp
          rm .github/workflows/pr44-final-review-fixes.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Address final implementation plan review findings'
          git push
